<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BlockWorld Deluxe</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none}.top,.stats,.cross,.hotbar,.mobile,.hint{position:absolute}.top{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:#111c;border:1px solid #fff4;padding:8px 10px;border-radius:10px;pointer-events:auto}.top button,.panel button{background:#333;color:#fff;border:1px solid #777;border-radius:6px;padding:7px 10px;font-weight:bold}.stats{top:10px;left:10px;background:#111c;padding:9px;border-radius:8px;font-size:13px;line-height:1.5}.cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:1px 1px #000}.hotbar{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}.slot{width:54px;height:54px;border:3px solid #666;background:#222d;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;cursor:pointer}.slot.active{border-color:#fff;box-shadow:0 0 0 2px #000}.slot small{position:absolute;bottom:1px;right:3px;font-size:11px}.hint{right:10px;bottom:10px;background:#111c;padding:8px;border-radius:7px;font-size:12px;text-align:right}.panel{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,94vw);max-height:88vh;overflow:auto;background:#191919f7;border:2px solid #777;border-radius:12px;padding:18px;box-shadow:0 20px 70px #000b}.hidden{display:none}.tabs{display:flex;gap:5px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.item{background:#292929;border:1px solid #555;border-radius:6px;padding:8px;text-align:center;cursor:pointer}.item b{display:block;font-size:25px}.recipe{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#292929;padding:9px;margin:5px 0;border-radius:6px}.mobile{display:none;bottom:80px;left:10px;right:10px;justify-content:space-between;pointer-events:auto}.mobile button{width:55px;height:55px;background:#1119;color:#fff;border:2px solid #fff7;border-radius:10px;font-size:21px}.dpad{display:grid;grid-template-columns:repeat(3,55px);gap:4px}.actions{display:flex;gap:5px;align-items:end}@media(max-width:700px){.mobile{display:flex}.hint{display:none}.top{max-width:95vw;overflow:auto;white-space:nowrap}.grid{grid-template-columns:repeat(4,1fr)}.slot{width:43px;height:43px;font-size:21px}.stats{font-size:11px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><b>⛏️ BlockWorld Deluxe</b><span id="clock">Tag 1 · 06:00</span><button id="inv">Inventar</button><button id="worldBtn">Neue Welt</button><button id="save">Speichern</button><button id="load">Laden</button><button id="pause">Pause</button></div><div class="stats"><b>Überleben</b><br>❤️ <span id="hp">20</span>/20 · 🍗 <span id="food">20</span>/20<br>🪙 <span id="score">0</span> · <span id="mode">Überleben</span></div><div class="cross">+</div><div id="bar" class="hotbar"></div><div class="hint">WASD · Space springen · Shift sprinten<br>Linksklick abbauen · Rechtsklick platzieren · E Inventar · F3 Debug</div><div class="mobile"><div class="dpad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div class="actions"><button id="mb">⛏️</button><button id="mp">🧱</button><button id="mj">↟</button></div></div></div><div id="panel" class="panel hidden"><h2>Inventar & Crafting</h2><div class="tabs"><button id="tabItems">Blöcke</button><button id="tabCraft">Crafting</button><button id="tabHelp">Hilfe</button></div><div id="content"></div><button id="close">Schließen</button></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const T={grass:['Gras','🌿','#63b34b','#805a38'],dirt:['Erde','🟫','#93633a','#684428'],stone:['Stein','🪨','#888','#626262'],wood:['Holz','🪵','#a06b37','#70451f'],sand:['Sand','🟨','#dfc77d','#b19d60'],water:['Wasser','💧','#3f91d2','#2768a3'],glass:['Glas','🔷','#b9e5ed','#79bac7'],brick:['Ziegel','🧱','#b95642','#85392c'],leaves:['Blätter','🍃','#3d963f','#28702e'],coal:['Kohle','⚫','#343434','#222'],iron:['Eisen','⚪','#c4c4c4','#8f8f8f'],gold:['Gold','🟡','#e7bd39','#a37e18'],diamond:['Diamant','💎','#54d8dc','#279da2'],snow:['Schnee','❄️','#eefaff','#b8d6e5']};
const hot=['grass','dirt','stone','wood','sand','water','brick','glass','leaves'];let sel=0,paused=false,debug=false,mode='survival';const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k>='1'&&k<='9'){sel=+k-1;drawBar()}if(k==='e')toggle();if(k==='f3')debug=!debug;if(k==='escape')close();if(k==='r')newWorld()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const S={w:64,h:38,d:24};let map=[];const id=(a,b,z)=>(z*S.h+b)*S.w+a;const ok=(a,b,z)=>a>=0&&b>=0&&z>=0&&a<S.w&&b<S.h&&z<S.d;const get=(a,b,z)=>ok(a,b,z)?map[id(a,b,z)]:null;const set=(a,b,z,t)=>{if(ok(a,b,z))map[id(a,b,z)]=t};
function newWorld(){map=new Array(S.w*S.h*S.d).fill(null);for(let a=0;a<S.w;a++){let ground=18+Math.floor(Math.sin(a*.25)*2+Math.sin(a*.07)*3);for(let b=ground;b<S.h;b++)set(a,b,0,b===ground?'grass':b<ground+4?'dirt':'stone');if(Math.random()<.12){for(let b=ground-1;b>ground-5;b--)set(a,b,0,'wood');for(let aa=a-2;aa<=a+2;aa++)for(let b=ground-7;b<ground-3;b++)if(Math.random()<.75)set(aa,b,0,'leaves')}}for(let i=0;i<45;i++){let a=2+Math.random()*(S.w-4)|0,b=4+Math.random()*12|0,z=1+Math.random()*12|0;if(!get(a,b,z))set(a,b,z,Math.random()<.65?'stone':'coal')}for(let i=0;i<18;i++){let a=2+Math.random()*(S.w-4)|0,b=8+Math.random()*15|0,z=1+Math.random()*18|0;if(!get(a,b,z))set(a,b,z,Math.random()<.5?'iron':'gold')}for(let i=0;i<8;i++){let a=3+Math.random()*(S.w-6)|0,b=4+Math.random()*10|0,z=2+Math.random()*20|0;if(!get(a,b,z))set(a,b,z,'diamond')}player.x=S.w/2;player.z=5;player.y=surface(player.x,0)-2;hp=20;food=20;score=0;start=Date.now();autosave();}function surface(a,z){for(let b=0;b<S.h;b++)if(get(a,b,z))return b;return S.h-1}
let player={x:32,y:15,z:5,vy:0,on:false};let cam={...player};let hp=20,food=20,score=0,start=Date.now();newWorld();
function solid(t){return t&&t!=='water'&&t!=='glass'&&t!=='leaves'}function move(dt){if(paused)return;let sp=keys.shift?8:4.5,dx=0,dz=0;if(keys.w||keys.arrowup)dz-=sp*dt;if(keys.s||keys.arrowdown)dz+=sp*dt;if(keys.a||keys.arrowleft)dx-=sp*dt;if(keys.d||keys.arrowright)dx+=sp*dt;player.x=Math.max(1,Math.min(S.w-2,player.x+dx));player.z=Math.max(1,Math.min(S.d-2,player.z+dz));player.vy+=19*dt;player.y+=player.vy*dt;let g=surface(player.x|0,player.z|0);if(player.y>=g-1){player.y=g-1;player.vy=0;player.on=true}else player.on=false;if(keys[' ']&&player.on){player.vy=-7.5;player.on=false}cam.x+=(player.x-cam.x)*.16;cam.y+=(player.y-cam.y)*.16;cam.z+=(player.z-cam.z)*.16}
function P(a,b,z){return[W/2+(a-cam.x)*34+(z-cam.z)*20,H*.58+(b-cam.y)*34-(a-cam.x)*14-(z-cam.z)*9]}function block(a,b,z,t){let p=P(a,b,z),q=P(a+1,b,z),r=P(a,b,z+1),u=P(a+1,b,z+1),s=34;x.beginPath();x.moveTo(...p);x.lineTo(...q);x.lineTo(...u);x.lineTo(...r);x.closePath();x.fillStyle=T[t][2];x.fill();x.strokeStyle='#0003';x.stroke();x.beginPath();x.moveTo(...p);x.lineTo(...q);x.lineTo(q[0],q[1]+s);x.lineTo(p[0],p[1]+s);x.closePath();x.fillStyle=T[t][3];x.fill();x.stroke();x.beginPath();x.moveTo(...p);x.lineTo(...r);x.lineTo(r[0],r[1]+s);x.lineTo(p[0],p[1]+s);x.closePath();x.fillStyle=T[t][3];x.fill();x.stroke()}
function render(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#75b7e5');g.addColorStop(1,'#dff4ff');x.fillStyle=g;x.fillRect(0,0,W,H);let a=[];for(let z=0;z<S.d;z++)for(let b=0;b<S.h;b++)for(let q=0;q<S.w;q++){let t=get(q,b,z);if(t)a.push({q,b,z,t,d:(q-cam.x)**2+(b-cam.y)**2+(z-cam.z)**2})}a.sort((m,n)=>n.d-m.d);a.slice(0,800).forEach(o=>block(o.q,o.b,o.z,o.t));let p=P(player.x,player.y,player.z);x.fillStyle='#f0c19b';x.fillRect(p[0]-9,p[1]-30,18,22);x.fillStyle='#3157bd';x.fillRect(p[0]-10,p[1]-8,20,27);if(debug){x.fillStyle='#fff';x.fillRect(10,92,260,72);x.fillStyle='#111';x.font='13px monospace';x.fillText(`XYZ ${player.x.toFixed(1)} ${player.y.toFixed(1)} ${player.z.toFixed(1)}`,18,112);x.fillText(`FPS ${Math.round(1/dt)} · ${mode}`,18,132);x.fillText(`Welt ${S.w}×${S.h}×${S.d}`,18,152)}}
let last=performance.now(),dt=.016;function loop(n){dt=Math.min(.05,(n-last)/1000);last=n;move(dt);render();clock();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function clock(){let m=((Date.now()-start)/1000*2+360)%1440;let h=Math.floor(m/60),mi=Math.floor(m%60);document.getElementById('clock').textContent=`Tag 1 · ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;document.getElementById('hp').textContent=Math.max(0,hp);document.getElementById('food').textContent=Math.max(0,food);document.getElementById('score').textContent=score;document.getElementById('mode').textContent=mode}
function drawBar(){let b=document.getElementById('bar');b.innerHTML='';hot.forEach((t,i)=>{let d=document.createElement('div');d.className='slot'+(i===sel?' active':'');d.innerHTML=T[t][1]+`<small>${i+1}</small>`;d.onclick=()=>{sel=i;drawBar()};b.appendChild(d)})}drawBar();
function target(){let a=Math.floor(player.x),z=Math.floor(player.z),b=Math.floor(player.y);return{a,z,b}}function mine(){let r=target();for(let b=r.b+2;b>=Math.max(0,r.b-4);b--)if(get(r.a,b,r.z)){set(r.a,b,r.z,null);score++;return}}function place(){let r=target();let b=Math.max(0,Math.min(S.h-1,r.b));if(!get(r.a,b,r.z))set(r.a,b,r.z,hot[sel])}c.oncontextmenu=e=>e.preventDefault();c.onmousedown=e=>e.button===0?mine():e.button===2&&place();
function toggle(){document.getElementById('panel').classList.toggle('hidden');items()}function close(){document.getElementById('panel').classList.add('hidden')}document.getElementById('inv').onclick=toggle;document.getElementById('close').onclick=close;document.getElementById('worldBtn').onclick=()=>{if(confirm('Neue Welt erstellen?'))newWorld()};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Weiter':'Pause'};
function items(){let c=document.getElementById('content');c.innerHTML='';Object.entries(T).forEach(([k,v])=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${v[1]}</b>${v[0]}`;d.onclick=()=>{hot[sel]=k;drawBar()};c.appendChild(d)});c.className='grid'}document.getElementById('tabItems').onclick=items;document.getElementById('tabCraft').onclick=()=>{let c=document.getElementById('content');c.className='';c.innerHTML=`<div class="recipe">🪵 Holz → 4 Bretter <button onclick="craft('wood')">Herstellen</button></div><div class="recipe">🪨 Stein + Holz → Spitzhacke <button onclick="craft('stone')">Herstellen</button></div><div class="recipe">⚫ Kohle + Holz → Fackel <button onclick="craft('coal')">Herstellen</button></div><div class="recipe">🟨 Sand → 🔷 Glas <button onclick="craft('sand')">Herstellen</button></div><div class="recipe">⚪ Eisen + Kohle → Eisenbarren <button onclick="craft('iron')">Herstellen</button></div><div class="recipe">🟡 Gold → Goldbarren <button onclick="craft('gold')">Herstellen</button></div>`};document.getElementById('tabHelp').onclick=()=>{let c=document.getElementById('content');c.className='';c.innerHTML='<p><b>Steuerung:</b> WASD bewegen, Space springen, Shift sprinten, Linksklick abbauen, Rechtsklick platzieren, 1–9 Hotbar, E Inventar, F3 Debug, R neue Welt.</p><p>Die Welt wird lokal im Browser gespeichert. Diese Version nutzt eigene Grafiken und ist keine Kopie offizieller Minecraft-Assets.</p>'};window.craft=t=>{score+=10;alert('Herstellung abgeschlossen!')};
function save(){localStorage.setItem('blockworld-deluxe',JSON.stringify({map,player,hp,food,score,start,hot}));alert('Spiel gespeichert!')}function load(){let s=localStorage.getItem('blockworld-deluxe');if(!s)return alert('Kein Spielstand.');try{let o=JSON.parse(s);map=o.map;player=o.player;hp=o.hp;food=o.food;score=o.score;start=o.start;if(Array.isArray(o.hot))hot.splice(0,hot.length,...o.hot);drawBar();alert('Spielstand geladen!')}catch(e){alert('Laden fehlgeschlagen.')}}document.getElementById('save').onclick=save;document.getElementById('load').onclick=load;function autosave(){localStorage.setItem('blockworld-deluxe',JSON.stringify({map,player,hp,food,score,start,hot}))}setInterval(autosave,15000);
document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();keys[b.dataset.k]=true});b.addEventListener('touchend',()=>keys[b.dataset.k]=false)});document.getElementById('mb').onclick=mine;document.getElementById('mp').onclick=place;document.getElementById('mj').onclick=()=>{if(player.on)player.vy=-7.5};})();</script></body></html>
