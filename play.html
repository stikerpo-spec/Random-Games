<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b17"><title>Random Games – Spiel</title><link rel="stylesheet" href="styles.css"><style>body{overflow:hidden}.playbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #23304a;background:rgba(7,11,23,.9);backdrop-filter:blur(18px);position:relative;z-index:5}.playbar .brand{font-weight:800;text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}.back{padding:10px 14px;border:1px solid #34425e;border-radius:12px;color:inherit;text-decoration:none;background:#111a2d}.play-wrap{height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:14px}.play-card{width:min(1080px,96vw);height:min(760px,94vh);display:flex;flex-direction:column;background:#0b1222;border:1px solid #273653;border-radius:24px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.35)}.game-head{display:flex;justify-content:space-between;gap:20px;padding:18px 22px;border-bottom:1px solid #24314a}.game-head h1{margin:0;font-size:28px}.meta{color:#95a3bc;font-size:14px;margin-top:5px}.game-tools{display:flex;gap:8px;align-items:center}.game-btn{border:1px solid #34425e;background:#141e34;color:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}.stage canvas{max-width:100%;max-height:100%;display:block;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}.hint{text-align:center;color:#8998b1;font-size:13px;padding:10px 18px 15px;border-top:1px solid #24314a}.err{padding:30px;text-align:center;color:#ffb4bf}.light .playbar{background:#fff}.light .play-card{background:#fff;border-color:#dce3ef}.light .game-btn{background:#f4f6fa;color:#13203a}.light .back{background:#f4f6fa}@media(max-width:700px){.playbar{padding:0 12px;height:64px}.play-wrap{height:calc(100vh - 64px);padding:7px}.play-card{height:98vh;border-radius:16px}.game-head{padding:12px}.game-head h1{font-size:22px}.stage{padding:5px}.hint{font-size:11px;padding:7px}}</style></head><body><header class="playbar"><a class="brand" href="index.html"><span class="brand-mark">RG</span><span>Random Games</span></a><a class="back" href="index.html">← Zur Sammlung</a></header><main class="play-wrap"><section class="play-card"><div class="game-head"><div><h1 id="title">Spiel</h1><div class="meta"><span id="cat">Arcade</span> · <span id="score">Score 0</span> · <span id="best">Best 0</span></div></div><div class="game-tools"><button class="game-btn" id="restart">↻ Neustart</button><button class="game-btn" id="pause">Ⅱ Pause</button></div></div><div class="stage" id="stage"></div><div class="hint" id="hint">Lade Spiel…</div></section></main><script src="play.js"></script></body></html>
