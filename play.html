<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<title>Random Games – Spiel</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.playbar{position:fixed;inset:0 0 auto 0;height:62px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,rgba(3,6,14,.96),rgba(3,6,14,.72));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);z-index:20}.brand,.back{color:#fff;text-decoration:none}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#24d2a7);font-size:13px}.toolbar{display:flex;gap:8px;align-items:center}.game-btn,.back{border:1px solid rgba(255,255,255,.12);background:rgba(17,25,43,.88);color:#fff;border-radius:11px;padding:9px 12px;cursor:pointer;text-decoration:none}.play-wrap{position:fixed;inset:62px 0 0 0;display:flex;align-items:stretch;justify-content:center}.play-card{width:100%;height:100%;display:flex;flex-direction:column;background:#050812}.game-head{height:62px;min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 18px;background:rgba(7,12,25,.88);border-bottom:1px solid rgba(255,255,255,.07);z-index:10}.game-head h1{margin:0;font-size:22px;line-height:1}.meta{color:#9eabc0;font-size:12px;margin-top:5px}.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;background:#02050b}.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:0;box-shadow:none;touch-action:none}.hint{height:32px;min-height:32px;display:flex;align-items:center;justify-content:center;color:#9aa8bd;font-size:12px;padding:0 12px;background:rgba(7,12,25,.9);border-top:1px solid rgba(255,255,255,.07);z-index:10}.is-fullscreen .playbar,.is-fullscreen .game-head,.is-fullscreen .hint{display:none}.is-fullscreen .play-wrap{inset:0}.is-fullscreen .stage{background:#000}.is-fullscreen .stage canvas{max-width:100vw;max-height:100vh}@media(max-width:700px){.playbar{height:52px;padding:0 9px}.play-wrap{inset:52px 0 0}.game-head{height:50px;min-height:50px;padding:7px 10px}.game-head h1{font-size:17px}.game-tools .game-btn{padding:7px 9px;font-size:12px}.hint{height:26px;min-height:26px;font-size:10px}.brand-mark{width:29px;height:29px}.brand span:last-child{font-size:13px}}
</style>
</head>
<body>
<header class="playbar">
<a class="brand" href="index.html"><span class="brand-mark">RG</span><span>Random Games</span></a>
<div class="toolbar"><a class="back" href="index.html">← Sammlung</a><button class="game-btn" id="fullBtn" type="button">⛶ Vollbild</button></div>
</header>
<main class="play-wrap"><section class="play-card">
<div class="game-head"><div><h1 id="title">Spiel</h1><div class="meta"><span id="cat">Arcade</span> · <span id="score">Score 0</span> · <span id="best">Best 0</span></div></div><div class="game-tools"><button class="game-btn" id="restart" type="button">↻ Neustart</button><button class="game-btn" id="pause" type="button">Ⅱ Pause</button></div></div>
<div class="stage" id="stage"></div><div class="hint" id="hint">Lade Spiel…</div>
</section></main>
<script>
const fullBtn=document.getElementById('fullBtn');
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch{}}
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;document.body.classList.toggle('is-fullscreen',on);fullBtn.textContent=on?'✕ Fenster':'⛶ Vollbild'});fullBtn.addEventListener('click',toggleFullscreen);
const script=document.createElement('script');
script.src='play.js?v=e9543942';
script.onerror=()=>{document.getElementById('hint').textContent='Dieses Spiel konnte nicht geladen werden.';};
document.body.appendChild(script);
</script>
</body>
</html>
